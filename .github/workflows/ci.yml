name: Test and release

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-policy:
    name: Version policy
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check application version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python .github/scripts/check_version.py --base "$BASE_SHA" --output "$GITHUB_OUTPUT"

  test-build:
    name: Windows tests and executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        # PDF text fingerprints were captured with pypdf 6.4.2.
        run: python -m pip install -r requirements.txt pypdf==6.4.2 pyinstaller
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Build Windows executable
        run: python -m PyInstaller guardrail.spec -y
      - uses: actions/upload-artifact@v7
        with:
          name: guardrail-windows
          path: dist/guardrail.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version-policy, test-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version-policy.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: guardrail-windows
          path: dist
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version-policy.outputs.tag }}
          APP_VERSION: ${{ needs.version-policy.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its published asset."
          else
            gh release create "$RELEASE_TAG" dist/guardrail.exe --target "$RELEASE_SHA" --title "Guardrail Calculator $APP_VERSION" --generate-notes --latest
          fi
