name: Test and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Windows tests and executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Build Windows executable
        run: python -m PyInstaller guardrail.spec -y
      - uses: actions/upload-artifact@v7
        with:
          name: guardrail-windows
          path: dist/guardrail.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: test-build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: guardrail-windows
          path: dist
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/guardrail.exe --clobber
          else
            gh release create "$RELEASE_TAG" dist/guardrail.exe --verify-tag --generate-notes
          fi
